name: CI Pipeline

on:
push:
branches: [main, develop]
pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
     postgres:
      image: postgres:15
      env:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_DB: test_db
      ports:
        - 5432:5432
      options: >-
        --health-cmd="pg_isready"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run lint
      run: |
        pip install flake8
        flake8 .

    - name: Run tests
      env:
        DATABASE_URL:postgresql+asyncpg://test:test@localhost:5432/test_db
      run: |
        pytest

x-backend-service: &backend-service
  image: library-app-backend:${IMAGE_TAG:-latest}
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env.production
  environment:
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: redis://redis:6379
    INTERNAL_API_BASE_URL: http://nginx/api/v1
    INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  restart: unless-stopped
  networks:
    - library-network

x-backend-healthcheck: &backend-healthcheck
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - library-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - library-network

  backend-1:
    <<: [*backend-service, *backend-healthcheck]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-2:
    <<: [*backend-service, *backend-healthcheck]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  book-grpc:
    <<: *backend-service
    command: python -m app.grpc.run_book_grpc_server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-consumer:
    <<: *backend-service
    command: python -m app.application.outbox_consumer
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  read-model-consumer:
    <<: *backend-service
    command: python -m app.application.read_model_consumer
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  audit-consumer:
    <<: *backend-service
    command: python -m app.application.audit_consumer
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: library-app-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost/nginx-health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - library-network

  frontend:
    image: library-app-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - library-network

networks:
  library-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: